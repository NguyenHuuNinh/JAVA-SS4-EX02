spring.application.name=course-management
# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/course_management
# LƯU Ý: Thay 'course_user' và 'course_password' bằng username và password PostgreSQL thực tế trên máy bạn (thường username là 'postgres')
spring.datasource.username=course_user
spring.datasource.password=course_password

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update

# ===============================
# SQL LOG
# ===============================
spring.jpa.show-sql=true